name: PHP planning panel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  planning-panel:
    name: planning-panel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Host compatibility and syntax
        run: |
          php bin/check-host.php
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Verify release manifest
        run: |
          php bin/build-ui.php --check
          php bin/build-manifest.php --check
      - name: Application and installer checks
        run: |
          php tests/run.php
          php tests/loader.php
          php tests/signing.php
          php tests/storage.php
          php tests/updates.php
          php tests/agent.php
          php tests/agent_adapter.php
          python3 -B -m unittest -v tests/http_smoke.py
          python3 -B -m unittest -v tests/standalone_smoke.py
          python3 -B -m unittest -v tests/passwordless_smoke.py
          python3 -B -m unittest -v tests/pin_smoke.py
      - name: Browser UI and accessibility
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:ui
      - name: Retain UI review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-review
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
